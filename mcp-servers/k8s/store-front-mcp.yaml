apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-front-mcp
  namespace: pets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-front-mcp
  template:
    metadata:
      labels:
        app: store-front-mcp
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
        - name: store-front-mcp
          image: __ACR_NAME__.azurecr.io/aks-store-demo/store-front-mcp:latest
          ports:
            - containerPort: 8100
              name: mcp
          env:
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3002"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3000"
            - name: PORT
              value: "8100"
            - name: MCP_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: username
            - name: MCP_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8100
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8100
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: store-front-mcp
  namespace: pets
spec:
  ports:
    - port: 80
      targetPort: 8100
      name: http
  selector:
    app: store-front-mcp
  type: ClusterIP
