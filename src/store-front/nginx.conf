server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # for spa routing
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","version":"${APP_VERSION}"}';
    }

    # Credential check used by the login page. Returns 401 (with a JSON body)
    # when the submitted Basic credentials are wrong, 200 when they are valid.
    location = /api/auth/login {
        include /etc/nginx/auth.conf;
        default_type application/json;
        # Served as a static file (not `return`) so the auth_basic access phase
        # actually runs - `return` is handled in the earlier rewrite phase.
        alias /usr/share/nginx/html/auth-check.json;
    }

    location /api/orders {
        include /etc/nginx/auth.conf;
        rewrite ^/api/orders$ / break;
        rewrite ^/api/orders(/.*)$ $1 break;
        proxy_pass http://order-service:3000;
        proxy_http_version 1.1;
    }

    location /api/products {
        include /etc/nginx/auth.conf;
        rewrite ^/api/products$ / break;
        rewrite ^/api/products(/.*)$ $1 break;
        proxy_pass http://product-service:3002;
        proxy_http_version 1.1;
    }
}